<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova Lab · Personal Assistant</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.5 system-ui, sans-serif;
      color: #172a24;
      background: #f6f8f4;
      --accent: #245643;
      --muted: #50635a;
      --border: #dbe4dc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    :focus-visible { outline: 2px solid #387758; outline-offset: 4px; }
    header { border-bottom: 1px solid var(--border); background: #fff; }
    header div, main { width: min(100% - 2rem, 66rem); margin-inline: auto; }
    header div { display: flex; align-items: center; gap: .65rem; height: 4rem; font-weight: 750; }
    .mark {
      display: grid;
      place-items: center;
      width: 2rem;
      height: 2rem;
      border-radius: .65rem;
      background: var(--accent);
      color: white;
    }
    main { padding-block: clamp(1.8rem, 5vw, 4rem); }
    h1 {
      margin: 0 0 1.65rem;
      font-family: Georgia, serif;
      font-size: clamp(2.1rem, 6vw, 4rem);
      font-weight: 500;
      line-height: 1.04;
      letter-spacing: -.045em;
    }
    .workspace {
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      background: white;
      box-shadow: 0 12px 45px #172a2409;
    }
    nav { display: flex; gap: .25rem; padding: .55rem; border-bottom: 1px solid var(--border); }
    nav button, .secondary, .delete {
      background: white;
      border: 1px solid transparent;
      border-radius: .55rem;
      padding: .55rem .85rem;
      color: var(--accent);
      font-weight: 650;
    }
    nav button[aria-pressed="true"], #favorites-only[aria-pressed="true"] { background: #e8f1e9; }
    .primary {
      border: 1px solid var(--accent);
      border-radius: .6rem;
      background: var(--accent);
      color: white;
      padding: .55rem 1rem;
      font-weight: 650;
    }
    .secondary { border-color: var(--border); }
    .delete { color: #96382d; }
    .delete:hover { background: #fdf0ed; }
    .panel { padding: clamp(.9rem, 3vw, 1.65rem); }
    .row { display: flex; gap: .75rem; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    h2, h3, p { margin: 0; }
    h2 { font-size: 1.4rem; }
    h3 { font-size: 1rem; }
    #search-label { display: block; margin-block: 1.2rem .45rem; }
    input, textarea {
      width: 100%;
      padding: .67rem .8rem;
      border: 1px solid #bdcec1;
      border-radius: .6rem;
      color: inherit;
      background: white;
    }
    textarea { resize: vertical; }
    #favorites-only { margin-top: .65rem; }
    #favorites-only[hidden] { display: none; }
    .filters { display: flex; flex-wrap: wrap; align-items: end; gap: .65rem; margin-top: .65rem; }
    .filters[hidden] { display: none; }
    .filters label { display: grid; gap: .25rem; flex: 1 1 10rem; }
    .filters select { font: inherit; padding: .67rem .8rem; border: 1px solid #bdcec1; border-radius: .6rem; background: white; color: inherit; }
    .tags { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .6rem; }
    .tag { padding: .12rem .52rem; border-radius: 1rem; background: #e8f1e9; color: var(--accent); font-size: .82rem; }
    #records {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      gap: .75rem;
      margin-top: 1rem;
    }
    .card {
      padding: 1rem;
      background: #fbfcfa;
      border: 1px solid var(--border);
      border-radius: .85rem;
      overflow-wrap: anywhere;
    }
    .card h3 { margin-bottom: .6rem; }
    .card p { white-space: pre-wrap; }
    dl { margin: 0; }
    dt { font-size: .8rem; color: var(--muted); }
    dd { margin: 0 0 .45rem; }
    .actions, .phone-row { display: flex; flex-wrap: wrap; gap: .4rem; }
    .actions { margin-top: .9rem; }
    .phone-row { align-items: center; }
    .phone-row button { padding: .1rem .4rem; }
    .empty {
      grid-column: 1 / -1;
      padding: 1.4rem 1rem;
      text-align: center;
      color: var(--muted);
      background: #f7faf6;
      border-radius: .65rem;
    }
    #status { min-height: 1.5em; color: var(--muted); margin-top: .9rem; }
    dialog {
      width: min(100% - 2rem, 31rem);
      max-height: calc(100% - 2rem);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.4rem;
      color: inherit;
    }
    dialog::backdrop { background: #13282080; }
    form label { display: grid; gap: .25rem; margin-block: .8rem; font-weight: 600; }
    form label input, form label textarea { font-weight: 400; }
    form footer { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
    #error { color: #96382d; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
</head>
<body>
  <header><div><span class="mark" aria-hidden="true">N</span> Nova Lab</div></header>
  <main>
    <h1>Personal Assistant</h1>
    <section class="workspace" aria-label="Personal assistant">
      <nav aria-label="Workspace">
        <button type="button" id="contacts-tab" aria-pressed="true" disabled>Contacts</button>
        <button type="button" id="notes-tab" aria-pressed="false" disabled>Notes</button>
        <button type="button" id="birthdays-tab" aria-pressed="false" disabled>Birthdays</button>
      </nav>
      <div class="panel">
        <div class="row">
          <h2 id="section-title">Contacts</h2>
          <button type="button" class="primary" id="add" disabled>+ New contact</button>
        </div>
        <div id="search-controls">
          <label id="search-label" for="search">Search contacts</label>
          <input id="search" type="search" disabled>
        </div>
        <button type="button" class="secondary" id="favorites-only" aria-pressed="false" hidden>
          Favorites only
        </button>
        <div class="filters" id="note-filters" hidden>
          <label>Tag <input id="tag-filter" placeholder="Exact tag, e.g. party"></label>
          <label>Sort notes
            <select id="note-order">
              <option value="pinned">Pinned first</option>
              <option value="tag">By tag</option>
            </select>
          </label>
        </div>
        <form class="filters" id="birthday-filters" hidden>
          <label>Days ahead <input id="birthday-days" inputmode="numeric" placeholder="Blank for the next 7 days"></label>
          <button type="submit" class="secondary">Show birthdays</button>
        </form>
        <div id="records"></div>
        <p id="status" role="status">Loading assistant…</p>
      </div>
    </section>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <h2 id="editor-title"></h2>
      <div id="fields"></div>
      <p id="error" role="alert"></p>
      <footer>
        <button type="button" class="secondary" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </footer>
    </form>
  </dialog>

  <template id="contact-fields">
    <label>Name<input name="name" required></label>
    <label>Phone numbers (comma-separated)<input name="phones"></label>
    <label>Email<input name="email"></label>
    <label>Address<input name="address"></label>
    <label>Birthday (DD.MM.YYYY)<input name="birthday" placeholder="DD.MM.YYYY"></label>
  </template>
  <template id="note-fields">
    <label>Note<textarea name="text" required rows="5"></textarea></label>
    <label>Tags (comma-separated)<input name="tags" placeholder="party, supplies"></label>
  </template>

<script type="text/plain" id="python-bridge">
import json

if "NoteBook" not in globals():
    raise RuntimeError("This version of main.py does not include NoteBook yet.")


def make_contact(fields):
    record = Record(fields["name"])
    for phone in fields["phones"]:
        record.add_phone(phone)
    if fields["email"]:
        record.set_email(fields["email"])
    if fields["address"]:
        record.set_address(fields["address"])
    if fields["birthday"]:
        record.add_birthday(fields["birthday"])
    record.favorite = fields.get("favorite", False)
    return record


def contact_data(record):
    return {
        "name": str(record.name),
        "phones": [str(phone) for phone in record.phones],
        "email": str(record.email) if record.email is not None else "",
        "address": str(record.address) if record.address is not None else "",
        "birthday": str(record.birthday) if record.birthday is not None else "",
        "favorite": record.favorite,
    }


def note_data(note):
    return {
        "id": note.id,
        "text": note.text,
        "pinned": note.pinned,
        "tags": sorted(note.tags),
    }


def restore_web_data(state):
    book = AddressBook()
    notebook = NoteBook()
    try:
        contacts, notes = state["contacts"], state["notes"]
        if not isinstance(contacts, list) or not isinstance(notes, list):
            raise ValueError
        for fields in contacts:
            record = make_contact(fields)
            if book.find(record.name.value) is not None:
                raise ValueError
            book.add_record(record)
        for item in notes:
            note_id = item["id"]
            if type(note_id) is not int or note_id < 1 or note_id in notebook.notes:
                raise ValueError
            note = Note(note_id, item["text"])
            note.pinned = item.get("pinned", False)
            for tag in item.get("tags", []):
                note.add_tag(tag)
            notebook.notes[note.id] = note
        minimum_id = max(notebook.notes, default=0) + 1
        next_id = state.get("next_id", minimum_id)
        if type(next_id) is not int:
            raise ValueError
        notebook.next_id = max(next_id, minimum_id)
    except (AttributeError, KeyError, TypeError, ValueError):
        raise ValueError(
            "Stored browser data has an invalid format and was left untouched."
        ) from None
    return book, notebook


def browse_records(book, notebook, data):
    section = data["section"]
    if section == "birthdays":
        return birthday_results(book, data["days"])
    if section == "contacts":
        records = book.search_contacts(data["query"]) if data["query"] else book.values()
        records = sorted(records, key=lambda record: not record.favorite)
        return [
            contact_data(record) for record in records
            if not data["favorites_only"] or record.favorite
        ]

    query = data["query"]
    tag = data["tag"]
    text_matches = {note.id for note in notebook.search(query)} if query else None
    tag_matches = {note.id for note in notebook.search_by_tag(tag)} if tag else None
    notes = notebook.sort_by_tags() if data["order"] == "tag" else notebook.list_notes()
    return [
        note_data(note) for note in notes
        if (text_matches is None or note.id in text_matches)
        and (tag_matches is None or note.id in tag_matches)
    ]


def web_request(raw):
    request = json.loads(raw)
    data = request["data"]
    action = request["action"]

    try:
        book, notebook = restore_web_data(request["state"])
        if action == "browse":
            return json.dumps({"items": browse_records(book, notebook, data)})
        if action == "save_contact":
            record = make_contact(data["fields"])
            original = data["original"]
            name = record.name.value
            if book.find(name) is not None and name != original:
                raise ValueError(f"Contact '{name}' already exists.")
            if original is not None:
                old_record = get_record(book, original)
                record.favorite = old_record.favorite
                if original != name:
                    book.rename(original, name)
            book.add_record(record)
        elif action == "delete_contact":
            book.delete(data["name"])
        elif action == "toggle_favorite":
            record = get_record(book, data["name"])
            record.favorite = not record.favorite
        elif action == "remove_phone":
            record = get_record(book, data["name"])
            if not record.remove_phone(data["phone"]):
                raise ValueError("Phone number was not found.")
        elif action == "save_note":
            if data["id"] is None:
                note = notebook.add(data["text"])
            else:
                note = notebook.get(str(data["id"]))
                note.edit(data["text"])
            if "tags" in data:
                note.tags = {normalize_note_tag(tag) for tag in data["tags"]}
        elif action == "delete_note":
            notebook.delete(str(data["id"]))
        elif action == "toggle_pin":
            note = notebook.get(str(data["id"]))
            note.pinned = not note.pinned
        elif action != "load":
            raise ValueError("Unknown action.")
    except ValueError as error:
        return json.dumps({"error": str(error)})

    return json.dumps({"state": {
        "contacts": [contact_data(record) for record in book.values()],
        "notes": [note_data(note) for note in notebook.notes.values()],
        "next_id": notebook.next_id,
    }})
</script>

<script>
"use strict";

const get = (id) => document.getElementById(id);
const storageKey = "nova-lab-assistant-v1";
const emptyState = { contacts: [], notes: [], next_id: 1 };
const search = get("search");
const dialog = get("editor");
const form = get("editor-form");
let request, state, editing, storageSnapshot;
let section = "contacts";
let favoritesOnly = false;

function node(tag, value, className) {
  const item = document.createElement(tag);
  item.textContent = value;
  if (className) item.className = className;
  return item;
}

function button(label, action, className) {
  const item = node("button", label, className);
  item.type = "button";
  item.addEventListener("click", action);
  return item;
}

function callPython(action, data, current) {
  const result = JSON.parse(request(JSON.stringify({ action, data, state: current })));
  if (result.error) throw new Error(result.error);
  return result;
}

function send(action, data = {}, current = state) {
  const result = callPython(action, data, current);
  if (action !== "load") {
    if (localStorage.getItem(storageKey) !== storageSnapshot) {
      throw new Error("Data changed in another tab. Reload the page before saving.");
    }
    const nextSnapshot = JSON.stringify(result.state);
    try {
      localStorage.setItem(storageKey, nextSnapshot);
    } catch {
      throw new Error("Could not save to browser storage. Your previous data is unchanged.");
    }
    storageSnapshot = nextSnapshot;
  }
  state = result.state;
}

function updateRecord(action, data, message) {
  try {
    send(action, data);
    render();
    get("status").textContent = message;
  } catch (error) {
    get("status").textContent = error.message;
  }
}

function removeRecord(record) {
  const isContact = section === "contacts";
  const label = isContact ? record.name : "note #" + record.id;
  if (!window.confirm("Delete " + label + "?")) return;

  updateRecord(
    isContact ? "delete_contact" : "delete_note",
    isContact ? { name: record.name } : { id: record.id },
    "Deleted " + label + ".",
  );
}

function renderRecord(record, isContact) {
  const card = node("article", "", "card");
  const marked = isContact ? record.favorite : record.pinned;
  const title = isContact ? record.name : "Note #" + record.id;
  const marker = isContact ? " · Favorite" : " · Pinned";
  card.append(node("h3", title + (marked ? marker : "")));

  if (isContact) {
    const details = node("dl", "");
    if (record.phones.length) details.append(node("dt", "Phone"));

    for (const phone of record.phones) {
      const row = node("dd", phone, "phone-row");
      const remove = button("Remove", () => {
        updateRecord("remove_phone", { name: record.name, phone }, "Phone number removed.");
      }, "delete");
      remove.setAttribute("aria-label", "Remove phone number " + phone);
      row.append(remove);
      details.append(row);
    }

    const fields = [
      ["Email", record.email],
      ["Address", record.address],
      ["Birthday", record.birthday],
    ];
    for (const [label, value] of fields) {
      if (value) details.append(node("dt", label), node("dd", value));
    }
    if (details.children.length) card.append(details);
  } else {
    card.append(node("p", record.text));
    if (record.tags.length) {
      const tags = node("div", "", "tags");
      tags.setAttribute("aria-label", "Tags");
      for (const tag of record.tags) tags.append(node("span", tag, "tag"));
      card.append(tags);
    }
  }

  const toggleLabel = isContact
    ? (marked ? "Unfavorite" : "Favorite")
    : (marked ? "Unpin" : "Pin");

  const actions = node("div", "", "actions");
  actions.append(
    button(toggleLabel, () => {
      const action = isContact ? "toggle_favorite" : "toggle_pin";
      const data = isContact ? { name: record.name } : { id: record.id };
      const message = isContact
        ? (marked ? "Removed from favorites." : "Added to favorites.")
        : (marked ? "Note unpinned." : "Note pinned.");
      updateRecord(action, data, message);
    }, "secondary"),
    button("Edit", () => openEditor(record), "secondary"),
    button("Delete", () => removeRecord(record), "delete"),
  );
  card.append(actions);
  return card;
}

function renderBirthday(record) {
  const card = node("article", "", "card");
  card.append(node("h3", record.name), node("p", "Birthday: " + record.birthday_date));
  if (record.congratulation_date !== record.birthday_date) {
    card.append(node("p", "Congratulate on " + record.congratulation_date));
  }
  return card;
}

function render() {
  const isContact = section === "contacts";
  const isNote = section === "notes";
  const isBirthday = section === "birthdays";
  const query = search.value.trim();
  const tag = get("tag-filter").value.trim();
  get("favorites-only").hidden = !isContact;
  get("favorites-only").setAttribute("aria-pressed", favoritesOnly);
  get("contacts-tab").setAttribute("aria-pressed", isContact);
  get("notes-tab").setAttribute("aria-pressed", isNote);
  get("birthdays-tab").setAttribute("aria-pressed", isBirthday);
  get("section-title").textContent = isContact ? "Contacts" : isNote ? "Notes" : "Birthdays";
  get("search-controls").hidden = isBirthday;
  get("search-label").textContent = isContact ? "Search by name, phone, or email" : "Search notes";
  get("note-filters").hidden = !isNote;
  get("birthday-filters").hidden = !isBirthday;
  get("add").hidden = isBirthday;
  get("add").textContent = isContact ? "+ New contact" : "+ New note";

  const singular = isContact ? "contact" : "note";
  let message = "No " + section + " yet. Add your first " + singular + ".";
  if (query || (isContact && favoritesOnly) || (isNote && tag)) {
    message = "No matching " + section + ".";
  }
  if (isBirthday) message = "No upcoming birthdays for this selection.";

  try {
    const { items } = callPython("browse", {
      section, query, tag,
      order: get("note-order").value,
      days: get("birthday-days").value.trim(),
      favorites_only: favoritesOnly,
    }, state);
    const cards = items.map((item) => isBirthday ? renderBirthday(item) : renderRecord(item, isContact));
    get("records").replaceChildren(...(cards.length ? cards : [node("p", message, "empty")]));
  } catch (error) {
    get("records").replaceChildren(node("p", error.message, "empty"));
  }
}

function openEditor(record = null) {
  editing = record;
  const isContact = section === "contacts";
  const singular = isContact ? "contact" : "note";
  get("editor-title").textContent = (record ? "Edit " : "New ") + singular;
  const template = get(isContact ? "contact-fields" : "note-fields");
  get("fields").replaceChildren(template.content.cloneNode(true));

  if (record) {
    for (const input of get("fields").querySelectorAll("[name]")) {
      const value = record[input.name];
      input.value = Array.isArray(value) ? value.join(", ") : value;
    }
  }
  get("error").textContent = "";
  dialog.showModal();
  get("fields").querySelector("input, textarea").focus();
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(form));
  for (const key of Object.keys(fields)) fields[key] = fields[key].trim();

  try {
    if (section === "contacts") {
      fields.phones = fields.phones
        ? fields.phones.split(",").map((value) => value.trim())
        : [];
      send("save_contact", { fields, original: editing ? editing.name : null });
    } else {
      const tags = fields.tags ? fields.tags.split(",").map((tag) => tag.trim()) : [];
      send("save_note", { id: editing ? editing.id : null, text: fields.text, tags });
    }
    dialog.close();
    render();
    get("status").textContent = section === "contacts" ? "Contact saved." : "Note saved.";
  } catch (error) {
    get("error").textContent = error.message;
  }
});

get("add").addEventListener("click", () => openEditor());
get("cancel").addEventListener("click", () => dialog.close());
search.addEventListener("input", render);
get("tag-filter").addEventListener("input", render);
get("note-order").addEventListener("change", render);
get("birthday-filters").addEventListener("submit", (event) => {
  event.preventDefault();
  render();
});

get("favorites-only").addEventListener("click", () => {
  favoritesOnly = !favoritesOnly;
  render();
});

for (const tab of ["contacts", "notes", "birthdays"]) {
  get(tab + "-tab").addEventListener("click", () => {
    section = tab;
    search.value = "";
    get("status").textContent = "";
    render();
  });
}

window.addEventListener("DOMContentLoaded", async () => {
  try {
    const response = await fetch("./main.py");
    if (!response.ok) {
      throw new Error("Place index.html and main.py in the same published folder.");
    }

    const runtime = await loadPyodide();
    runtime.globals.set("__name__", "nova_lab_cli");
    runtime.runPython(await response.text());
    runtime.runPython(get("python-bridge").textContent);
    request = runtime.globals.get("web_request");

    storageSnapshot = localStorage.getItem(storageKey);
    let savedState = emptyState;
    if (storageSnapshot !== null) {
      try {
        savedState = JSON.parse(storageSnapshot);
      } catch {
        throw new Error("Stored browser data has an invalid format and was left untouched.");
      }
    }
    send("load", {}, savedState);

    for (const id of ["contacts-tab", "notes-tab", "birthdays-tab", "search", "add"]) {
      get(id).disabled = false;
    }
    get("status").textContent = "";
    render();
  } catch (error) {
    const message = String(error.message || error).trim().split("\n").pop();
    get("status").textContent = "Could not open the assistant. " + message;
  }
});
</script>
</body>
</html>
